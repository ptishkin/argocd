#install https://argo-cd.readthedocs.io/en/stable/user-guide/commands/argocd_app_create/
#argocd app create guestbook --file <path-to-yaml-file>
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-1.0.4-v1.9.1
  namespace: argocd
spec:
  destination:
    namespace: kubeflow
    name: in-cluster
  project: kubeflow
  #https://argo-cd.readthedocs.io/en/stable/user-guide/multiple_sources/#helm-value-files-from-external-git-repository
  sources:
    # Chart from Chart Repo
    - repoURL: https://github.com/TheCodingSheikh/helm-charts.git
      path: charts/kubeflow
      name: thecodingsheikh
      targetRevision: kubeflow-1.0.4
      helm:
        valueFiles:
        - $upvalues/TheCodingSheikh/charts/kubeflow/valuesup.yaml
    # Values from Git
    - repoURL: 'https://github.com/ptishkin/argocd.git'
      targetRevision: kubeflow-1.0.4-v1.9.1
      name: custom
      ref: upvalues